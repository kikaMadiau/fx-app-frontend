<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>MOTUYA Fx.</title>
		<!-- PWA : application installable sur téléphone, tablette et ordinateur -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap"
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#005ca9" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="MOTUYA Fx." />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script>
			// Thème choisi dans Paramètres, appliqué avant l'affichage (évite un flash blanc).
			try {
				var prefs = JSON.parse(localStorage.getItem('fx_preferences') || '{}');
				var theme = prefs.theme || 'light';
				var dark =
					theme === 'dark' ||
					(theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
