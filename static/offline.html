<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2563eb" />
		<title>MOTUYA Fx. – Hors connexion</title>
		<link rel="icon" href="/icons/favicon-64.png" />
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
				background: #f6f8fb;
				color: #0f172a;
			}
			main {
				max-width: 380px;
				text-align: center;
			}
			img {
				width: 72px;
				height: 72px;
				border-radius: 18px;
			}
			h1 {
				margin: 20px 0 8px;
				font-size: 22px;
			}
			p {
				margin: 0;
				color: #64748b;
				line-height: 1.6;
			}
			button {
				margin-top: 24px;
				border: 0;
				border-radius: 12px;
				background: #2563eb;
				color: #fff;
				padding: 12px 20px;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" />
			<h1>Vous êtes hors connexion</h1>
			<p>
				Cette page n'est pas disponible sans réseau. Les opérations de change ont besoin d'une
				connexion au serveur pour être enregistrées.
			</p>
			<button type="button" onclick="location.reload()">Réessayer</button>
		</main>
	</body>
</html>
